<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="6144" height="4096" viewBox="0 0 1536 1024"><title>燕雀湖落羽杉</title><desc>Five PNG image panels with editable vector text and layout. PNG illustrations are raster, not vector paths.</desc><style>text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#263F50}.serif{font-family:'Noto Serif SC','SimSun',serif}.bold{font-weight:600}.muted{fill:#637377}</style><g id="paper-background" inkscape:groupmode="layer" inkscape:label="纸张底色"><title>纸张底色</title><rect width="1536" height="1024" fill="#EDEBE4"/></g><g id="paper-texture" inkscape:groupmode="layer" inkscape:label="特种纸纤维与压纹"><title>特种纸纤维与压纹</title><image x="0" y="0" width="1536" height="1024" href="elements/paper-texture-image.png" preserveAspectRatio="xMidYMid slice" id="paper-texture-image" opacity="0.46"/></g><g id="series-header" inkscape:groupmode="layer" inkscape:label="系列页眉"><title>系列页眉</title><text x="42" y="39" font-size="12" letter-spacing="2">金陵秋日  /  JINLING AUTUMN</text><text x="1494" y="39" font-size="12" text-anchor="end" letter-spacing="2">古典版画 · 视觉提案</text><path d="M42 52h1452" stroke="#263F50" stroke-width=".6" opacity=".4"/></g><g id="theme-heading" inkscape:groupmode="layer" inkscape:label="主题标题"><title>主题标题</title><text x="42" y="128" font-size="60" class="serif bold" letter-spacing="4">燕雀湖落羽杉</text><text x="46" y="163" font-size="18" class="serif" letter-spacing="2">杉色映水，深秋如画，湖面渐红。</text></g><g id="main-image" inkscape:groupmode="layer" inkscape:label="主视觉 PNG"><title>主视觉 PNG</title><image x="42" y="194" width="780" height="642" href="elements/panel-main.png" preserveAspectRatio="xMidYMid slice" id="panel-main"/></g><g id="positioning" inkscape:groupmode="layer" inkscape:label="此间秋意"><title>此间秋意</title><text x="864" y="104" font-size="24" class="serif bold">此间秋意</text><text x="864" y="139" font-size="16" >落羽杉沿湖岸渐次染上焦糖色，</text><text x="864" y="166" font-size="16" >细羽枝叶把秋意带向水面。</text><text x="864" y="193" font-size="16" >倒影断在涟漪里，冷暖相融而安静。</text><path d="M864 221h630" stroke="#263F50" stroke-width=".6" opacity=".4"/></g><g id="details-heading" inkscape:groupmode="layer" inkscape:label="细节标题"><title>细节标题</title><text x="864" y="255" font-size="21" class="serif bold">细节参考</text></g><g id="detail-1" inkscape:groupmode="layer" inkscape:label="杉林秋色"><title>杉林秋色</title><image x="864" y="276" width="306" height="148" href="elements/panel-detail-1.png" preserveAspectRatio="xMidYMid slice" id="panel-detail-1"/><text x="864" y="450" font-size="17" class="serif bold">杉林秋色</text><text x="864" y="473" font-size="13" class="muted">锈橙焦糖，层次渐染。</text></g><g id="detail-2" inkscape:groupmode="layer" inkscape:label="羽状小枝"><title>羽状小枝</title><image x="1188" y="276" width="306" height="148" href="elements/panel-detail-2.png" preserveAspectRatio="xMidYMid slice" id="panel-detail-2"/><text x="1188" y="450" font-size="17" class="serif bold">羽状小枝</text><text x="1188" y="473" font-size="13" class="muted">线形小叶，细羽状排列。</text></g><g id="detail-3" inkscape:groupmode="layer" inkscape:label="湖面倒影"><title>湖面倒影</title><image x="864" y="491" width="306" height="148" href="elements/panel-detail-3.png" preserveAspectRatio="xMidYMid slice" id="panel-detail-3"/><text x="864" y="665" font-size="17" class="serif bold">湖面倒影</text><text x="864" y="688" font-size="13" class="muted">横向碎影，微波留白。</text></g><g id="detail-4" inkscape:groupmode="layer" inkscape:label="湖岸与远景"><title>湖岸与远景</title><image x="1188" y="491" width="306" height="148" href="elements/panel-detail-4.png" preserveAspectRatio="xMidYMid slice" id="panel-detail-4"/><text x="1188" y="665" font-size="17" class="serif bold">湖岸与远景</text><text x="1188" y="688" font-size="13" class="muted">岸线转折，树林渐远。</text></g><g id="palette" inkscape:groupmode="layer" inkscape:label="色彩参考"><title>色彩参考</title><path d="M864 715h630" stroke="#263F50" stroke-width=".6" opacity=".4"/><text x="864" y="749" font-size="21" class="serif bold">色彩参考</text><rect x="864" y="767" width="93" height="33" fill="#EDEBE4"/><text x="864" y="823" font-size="13" >纸白</text><text x="864" y="841" font-size="10" class="muted">#EDEBE4</text><rect x="971" y="767" width="93" height="33" fill="#C9D5DE"/><text x="971" y="823" font-size="13" >雾蓝</text><text x="971" y="841" font-size="10" class="muted">#C9D5DE</text><rect x="1078" y="767" width="93" height="33" fill="#2F4B6A"/><text x="1078" y="823" font-size="13" >靛青</text><text x="1078" y="841" font-size="10" class="muted">#2F4B6A</text><rect x="1185" y="767" width="93" height="33" fill="#B85C3A"/><text x="1185" y="823" font-size="13" >杉叶锈</text><text x="1185" y="841" font-size="10" class="muted">#B85C3A</text><rect x="1292" y="767" width="93" height="33" fill="#93684F"/><text x="1292" y="823" font-size="13" >焦糖棕</text><text x="1292" y="841" font-size="10" class="muted">#93684F</text><rect x="1399" y="767" width="93" height="33" fill="#D8D1C6"/><text x="1399" y="823" font-size="13" >米灰</text><text x="1399" y="841" font-size="10" class="muted">#D8D1C6</text></g><g id="design-notes" inkscape:groupmode="layer" inkscape:label="设计说明"><title>设计说明</title><path d="M42 865h1452" stroke="#263F50" stroke-width=".6" opacity=".4"/><text x="42" y="901" font-size="18" class="serif bold">风格关键词</text><text x="42" y="930" font-size="14" >落羽杉湖面映出断续的倒影</text><text x="42" y="954" font-size="14" >焦糖秋色中保留清冷水意</text><text x="339" y="901" font-size="18" class="serif bold">构图约束</text><text x="339" y="930" font-size="14" >垂直杉林对照横向展开的水面</text><text x="339" y="954" font-size="14" >弯曲湖岸线自然引出远近层次</text><text x="636" y="901" font-size="18" class="serif bold">色彩约束</text><text x="636" y="930" font-size="14" >锈橙棕红之间保留丰富色阶</text><text x="636" y="954" font-size="14" >冷灰湖面安静平衡大片暖色</text><text x="933" y="901" font-size="18" class="serif bold">材质与工艺</text><text x="933" y="930" font-size="14" >细密羽状枝叶清楚却不糊成团</text><text x="933" y="954" font-size="14" >水中倒影以断续套印痕迹表达</text><text x="1230" y="901" font-size="18" class="serif bold">避免事项</text><text x="1230" y="930" font-size="14" >不把落羽杉误画成普通红枫林</text><text x="1230" y="954" font-size="14" >不添加宏大建筑以及镜面静水</text></g><g id="footer" inkscape:groupmode="layer" inkscape:label="页脚"><title>页脚</title><path d="M42 982h1452" stroke="#263F50" stroke-width=".6" opacity=".4"/><text x="42" y="1007" font-size="11" letter-spacing="3">香 · 老 · 城 · 山 · 古 · 街 · 染</text><text x="1494" y="1007" font-size="11" text-anchor="end">金陵秋日 / 燕雀湖落羽杉</text></g></svg>