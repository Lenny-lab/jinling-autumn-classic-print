<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="6144" height="4096" viewBox="0 0 1536 1024"><title>石象路秋色</title><desc>Five PNG image panels with editable vector text and layout. PNG illustrations are raster, not vector paths.</desc><style>text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#263F50}.serif{font-family:'Noto Serif SC','SimSun',serif}.bold{font-weight:600}.muted{fill:#637377}</style><g id="paper-background" inkscape:groupmode="layer" inkscape:label="纸张底色"><title>纸张底色</title><rect width="1536" height="1024" fill="#EDEBE4"/></g><g id="paper-texture" inkscape:groupmode="layer" inkscape:label="特种纸纤维与压纹"><title>特种纸纤维与压纹</title><image x="0" y="0" width="1536" height="1024" href="elements/paper-texture-image.png" preserveAspectRatio="xMidYMid slice" id="paper-texture-image" opacity="0.46"/></g><g id="series-header" inkscape:groupmode="layer" inkscape:label="系列页眉"><title>系列页眉</title><text x="42" y="39" font-size="12" letter-spacing="2">金陵秋日  /  JINLING AUTUMN</text><text x="1494" y="39" font-size="12" text-anchor="end" letter-spacing="2">古典版画 · 视觉提案</text><path d="M42 52h1452" stroke="#263F50" stroke-width=".6" opacity=".4"/></g><g id="theme-heading" inkscape:groupmode="layer" inkscape:label="主题标题"><title>主题标题</title><text x="42" y="128" font-size="60" class="serif bold" letter-spacing="4">石象路秋色</text><text x="46" y="163" font-size="18" class="serif" letter-spacing="2">石兽静立，彩叶渐染，古意入秋。</text></g><g id="main-image" inkscape:groupmode="layer" inkscape:label="主视觉 PNG"><title>主视觉 PNG</title><image x="42" y="194" width="780" height="642" href="elements/panel-main.png" preserveAspectRatio="xMidYMid slice" id="panel-main"/></g><g id="positioning" inkscape:groupmode="layer" inkscape:label="此间秋意"><title>此间秋意</title><text x="864" y="104" font-size="24" class="serif bold">此间秋意</text><text x="864" y="139" font-size="16" >成对石象静立在神道两侧，</text><text x="864" y="166" font-size="16" >让克制的秋叶与石灰形成冷暖对照。</text><text x="864" y="193" font-size="16" >路向远处延伸，时光留在石上。</text><path d="M864 221h630" stroke="#263F50" stroke-width=".6" opacity=".4"/></g><g id="details-heading" inkscape:groupmode="layer" inkscape:label="细节标题"><title>细节标题</title><text x="864" y="255" font-size="21" class="serif bold">细节参考</text></g><g id="detail-1" inkscape:groupmode="layer" inkscape:label="石象形制"><title>石象形制</title><image x="864" y="276" width="306" height="148" href="elements/panel-detail-1.png" preserveAspectRatio="xMidYMid slice" id="panel-detail-1"/><text x="864" y="450" font-size="17" class="serif bold">石象形制</text><text x="864" y="473" font-size="13" class="muted">完整轮廓，石象静立于秋林。</text></g><g id="detail-2" inkscape:groupmode="layer" inkscape:label="石面微观"><title>石面微观</title><image x="1188" y="276" width="306" height="148" href="elements/panel-detail-2.png" preserveAspectRatio="xMidYMid slice" id="panel-detail-2"/><text x="1188" y="450" font-size="17" class="serif bold">石面微观</text><text x="1188" y="473" font-size="13" class="muted">孔隙与蚀痕，局部材质研究。</text></g><g id="detail-3" inkscape:groupmode="layer" inkscape:label="彩叶层叠"><title>彩叶层叠</title><image x="864" y="491" width="306" height="148" href="elements/panel-detail-3.png" preserveAspectRatio="xMidYMid slice" id="panel-detail-3"/><text x="864" y="665" font-size="17" class="serif bold">彩叶层叠</text><text x="864" y="688" font-size="13" class="muted">橙红与金叶局部相映。</text></g><g id="detail-4" inkscape:groupmode="layer" inkscape:label="神道空间"><title>神道空间</title><image x="1188" y="491" width="306" height="148" href="elements/panel-detail-4.png" preserveAspectRatio="xMidYMid slice" id="panel-detail-4"/><text x="1188" y="665" font-size="17" class="serif bold">神道空间</text><text x="1188" y="688" font-size="13" class="muted">居中石道，绿篱引向远处。</text></g><g id="palette" inkscape:groupmode="layer" inkscape:label="色彩参考"><title>色彩参考</title><path d="M864 715h630" stroke="#263F50" stroke-width=".6" opacity=".4"/><text x="864" y="749" font-size="21" class="serif bold">色彩参考</text><rect x="864" y="767" width="93" height="33" fill="#EDEBE4"/><text x="864" y="823" font-size="13" >纸白</text><text x="864" y="841" font-size="10" class="muted">#EDEBE4</text><rect x="971" y="767" width="93" height="33" fill="#C9D5DE"/><text x="971" y="823" font-size="13" >雾蓝</text><text x="971" y="841" font-size="10" class="muted">#C9D5DE</text><rect x="1078" y="767" width="93" height="33" fill="#2F4B6A"/><text x="1078" y="823" font-size="13" >靛青</text><text x="1078" y="841" font-size="10" class="muted">#2F4B6A</text><rect x="1185" y="767" width="93" height="33" fill="#C8643F"/><text x="1185" y="823" font-size="13" >秋叶橙</text><text x="1185" y="841" font-size="10" class="muted">#C8643F</text><rect x="1292" y="767" width="93" height="33" fill="#A8ACA7"/><text x="1292" y="823" font-size="13" >石灰</text><text x="1292" y="841" font-size="10" class="muted">#A8ACA7</text><rect x="1399" y="767" width="93" height="33" fill="#D8D1C6"/><text x="1399" y="823" font-size="13" >米灰</text><text x="1399" y="841" font-size="10" class="muted">#D8D1C6</text></g><g id="design-notes" inkscape:groupmode="layer" inkscape:label="设计说明"><title>设计说明</title><path d="M42 865h1452" stroke="#263F50" stroke-width=".6" opacity=".4"/><text x="42" y="901" font-size="18" class="serif bold">风格关键词</text><text x="42" y="930" font-size="14" >石兽神道映衬克制的深秋彩叶</text><text x="42" y="954" font-size="14" >沉静古意里保留漫长时间感</text><text x="339" y="901" font-size="18" class="serif bold">构图约束</text><text x="339" y="930" font-size="14" >成对石象稳稳压住画面两侧</text><text x="339" y="954" font-size="14" >中央石道向远处建立纵深层次</text><text x="636" y="901" font-size="18" class="serif bold">色彩约束</text><text x="636" y="930" font-size="14" >石灰与靛青承担主体冷色关系</text><text x="636" y="954" font-size="14" >低饱和秋叶只在局部形成映衬</text><text x="933" y="901" font-size="18" class="serif bold">材质与工艺</text><text x="933" y="930" font-size="14" >石面以斑驳缺墨表现风化印痕</text><text x="933" y="954" font-size="14" >不追求摄影般琐碎写实的细节</text><text x="1230" y="901" font-size="18" class="serif bold">避免事项</text><text x="1230" y="930" font-size="14" >不把庄重石兽处理成拟人卡通</text><text x="1230" y="954" font-size="14" >不加入无关的亭台水榭装饰</text></g><g id="footer" inkscape:groupmode="layer" inkscape:label="页脚"><title>页脚</title><path d="M42 982h1452" stroke="#263F50" stroke-width=".6" opacity=".4"/><text x="42" y="1007" font-size="11" letter-spacing="3">香 · 老 · 城 · 山 · 古 · 街 · 染</text><text x="1494" y="1007" font-size="11" text-anchor="end">金陵秋日 / 石象路秋色</text></g></svg>